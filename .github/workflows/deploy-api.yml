name: Deploy API to Render

on:
  workflow_dispatch:
    inputs:
      force_migrate:
        description: 'Force run Supabase migrations'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'supabase/**'
      - '.npmrc'
      - '.eslintrc.js'
      - '.prettierrc'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'yarn.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'supabase/**'
      - '.npmrc'
      - '.eslintrc.js'
      - '.prettierrc'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect migration changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare pushed commits
        id: diff
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE_MIGRATE: ${{ inputs.force_migrate }}
        run: |
          if [[ "$FORCE_MIGRATE" == "true" ]]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD~1"
          fi
          changed_files="$(git diff --name-only "$base" "$AFTER" -- supabase/migrations/ 2>/dev/null || true)"
          if [[ -n "$changed_files" ]]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:unit

  migrate:
    name: Migrate production Supabase
    needs: [build, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'adetfttrkukiwzhjpqld' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Check migration credentials
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN secret}"
          : "${SUPABASE_DB_PASSWORD:?Missing SUPABASE_DB_PASSWORD secret}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_PROJECT_REF secret}"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Check pending migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply pending migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build, changes, migrate]
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
          needs.build.result == 'success' && needs.changes.result == 'success' &&
          (needs.migrate.result == 'success' ||
           (needs.migrate.result == 'skipped' && needs.changes.outputs.migrations == 'false')) }}
    timeout-minutes: 10
    steps:
      - name: Deploy API to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          : "${RENDER_API_KEY:?Missing RENDER_API_KEY secret}"
          : "${RENDER_SERVICE_ID:?Missing RENDER_SERVICE_ID secret}"
          curl --fail --silent --show-error --max-time 60 --output /dev/null -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$COMMIT_SHA\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

      - name: Log deployment
        run: echo "API deployment triggered on Render"
