# supabase/config.toml - Cấu hình tối giản cho Local Development

project_id = "QLCT"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = [
  "http://localhost:3001/**",
  "http://127.0.0.1:3001/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true # thay thế cho enable_signup
double_confirm_changes = false
enable_confirmations = false



# --- TẮT TOÀN BỘ DỊCH VỤ PHỤ TRỢ ĐỂ TRÁNH NGHẼN HEALTH CHECK ---

[realtime]
enabled = false

[local_smtp]
enabled = false

# BẮT BUỘC BẬT để CLI tạo schema và bảng storage.buckets
[storage]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false

[vector]
enabled = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"